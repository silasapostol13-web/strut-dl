<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT WORKED</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d7a4a">
<style>
  /* Deliberately LOUD and with NO redirect. /go was invisible, which made
     "never arrived" and "arrived then moved on" look identical. This page
     exists only to be unmistakable on arrival. */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
    background:#1d7a4a;color:#fff;min-height:100vh;display:flex;align-items:center;
    justify-content:center;text-align:center;padding:28px;-webkit-font-smoothing:antialiased}
  .big{font-size:66px;line-height:1;margin-bottom:14px}
  h1{font-size:38px;line-height:1.05;letter-spacing:-.8px;margin-bottom:12px}
  p{font-size:17px;line-height:1.45;opacity:.92;max-width:340px;margin:0 auto}
  .where{margin-top:20px;font-family:ui-monospace,Menlo,monospace;font-size:12px;
    opacity:.8;word-break:break-all;background:rgba(0,0,0,.18);padding:10px 12px;border-radius:10px}
  a.btn{display:block;margin:26px auto 0;max-width:320px;padding:17px 22px;border-radius:16px;
    background:#fff;color:#14603a;font-size:17px;font-weight:800;text-decoration:none}
  a.btn:active{transform:scale(.975)}
  .note{margin-top:16px;font-size:13.5px;opacity:.85}
</style>
</head>
<body>
<div>
  <div class="big">✅</div>
  <h1>IT WORKED</h1>
  <p>Safari navigated to our page. That means we can send people here from Instagram — and from here the App&nbsp;Store link works normally.</p>
  <div class="where" id="where"></div>
  <a class="btn" href="https://apps.apple.com/us/app/id6761438303">Get Strut on the App Store</a>
  <p class="note">Tell Claude you saw this green screen.</p>
</div>
<script>
  document.getElementById('where').textContent = window.location.href;
</script>
</body>
</html>
