<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round 5 — does Safari navigate or search?</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EAD9">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --cream:#F4EAD9;--card:#FCF7EE;--orange:#F26A1B;--ink:#141210;
    --muted:#8d7d68;--hair:#e6d8c2;--body:#5d5347;--ok:#1d7a4a;--bad:#b3341f;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  body{font-family:var(--sans);background:var(--cream);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:20px calc(16px + env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom));}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:21px;letter-spacing:-.3px;margin-bottom:6px}
  .lede{font-size:14.5px;line-height:1.5;color:var(--body);margin-bottom:12px}
  .lede b{color:var(--ink)}
  .count{background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;
    font-size:15px;font-weight:700;margin-bottom:14px;text-align:center}
  .box{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 15px;margin-bottom:14px}
  .box h2{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

  .test{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .test a{flex:1;display:block;padding:14px;border:1.5px solid var(--hair);
    border-radius:13px;background:var(--card);color:var(--ink);text-align:left;
    font-size:15px;font-weight:600;text-decoration:none}
  .test a:active{background:#f2e7d5}
  .test a.next{border-color:var(--orange);border-width:2.5px;background:#fff6ed}
  .test a.done{opacity:.5}
  .test .n{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;font-weight:400;margin-top:3px;word-break:break-all}
  .test .res{display:block;font-size:11.5px;font-weight:700;color:var(--ok);margin-top:4px}
  .chip{flex:0 0 auto;width:28px;text-align:center;font-size:19px;font-weight:700;padding-top:12px}
  .chip.wait{color:var(--muted);font-size:14px}
  .chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)}

  .cta{display:block;width:100%;margin-top:14px;padding:16px;border:none;border-radius:14px;
    background:var(--orange);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .cta:active{background:#d65a12}
  .reset{background:transparent;color:var(--muted);border:1.5px solid var(--hair);margin-top:9px;font-size:14px;font-weight:500}
  textarea{width:100%;height:200px;margin-top:12px;padding:11px;border:1px solid var(--hair);
    border-radius:12px;font-family:var(--mono);font-size:11px;background:#fff;color:var(--ink);display:none}
  textarea.show{display:block}

  /* ---- "what did you see?" modal ---- */
  .modal{position:fixed;inset:0;background:rgba(20,18,16,.62);display:none;
    align-items:center;justify-content:center;padding:22px;z-index:20}
  .modal.show{display:flex}
  .sheet{background:var(--card);border-radius:22px;padding:22px 20px;max-width:400px;width:100%}
  .sheet h3{font-size:18px;margin-bottom:4px}
  .sheet p{font-size:14px;color:var(--body);margin-bottom:16px;line-height:1.45}
  .sheet button{display:block;width:100%;margin-bottom:9px;padding:15px;border-radius:14px;
    border:1.5px solid var(--hair);background:#fff;color:var(--ink);
    font-family:var(--sans);font-size:15px;font-weight:600;text-align:left;cursor:pointer}
  .sheet button:active{background:#f2e7d5}
  .sheet button.good{border-color:var(--ok);color:var(--ok)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:var(--ink);color:#fff;font-size:14px;padding:12px 20px;border-radius:100px;
    opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;z-index:30}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Round 5</h1>
  <p class="lede"><b>x-web-search:// opens Safari</b> — Meta forgot to block it. Now: will Safari <b>go to a URL</b> we hand it, or just search for it? Tap the orange one, then <b>come back and tell me what you saw</b>.</p>

  <div class="count" id="count">0 of 5 answered</div>

  <div class="box">
    <h2>Payload forms</h2>
    <div id="tests"></div>
  </div>

  <button class="cta" id="copy">Copy results</button>
  <button class="cta reset" id="reset">Start over</button>
  <textarea id="out" readonly></textarea>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mtitle">What did you see?</h3>
    <p id="msub">Pick whatever actually happened in Safari.</p>
    <button class="good" data-v="APP STORE OPENED">📱 The App&nbsp;Store opened (jackpot)</button>
    <button class="good" data-v="MY PAGE LOADED IN SAFARI">🟠 Safari loaded my cream Strut page</button>
    <button data-v="SEARCH RESULTS">🔎 Safari showed search results</button>
    <button data-v="SAFARI OPENED BLANK/OTHER">⬜️ Safari opened but something else</button>
    <button data-v="NOTHING HAPPENED">✗ Nothing happened at all</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var GO    = 'silasapostol13-web.github.io/strut-dl/go/';
  var APPLE = 'apps.apple.com/us/app/id6761438303';
  var $ = function (id) { return document.getElementById(id); };
  var ua = navigator.userAgent || '';

  var RKEY='strut_r5_results', PKEY='strut_r5_pending';
  var mem={};
  function get(k){ try{return localStorage.getItem(k);}catch(e){return mem[k]||null;} }
  function set(k,v){ try{localStorage.setItem(k,v);}catch(e){mem[k]=v;} }
  function del(k){ try{localStorage.removeItem(k);}catch(e){delete mem[k];} }

  // All five hand Safari a URL-shaped string. The only question is whether
  // Safari's omnibox treats it as a location or as a search phrase, and the
  // exact shape of the string is likely to decide that.
  var TESTS = [
    { id:'full_go',    label:'1. Full https URL → our page',
      note:'x-web-search://?https://' + GO,
      href:'x-web-search://?https://' + GO },

    { id:'bare_go',    label:'2. Bare host+path → our page',
      note:'x-web-search://?' + GO,
      href:'x-web-search://?' + GO },

    { id:'enc_go',     label:'3. URL-encoded → our page',
      note:'x-web-search://?<encoded>',
      href:'x-web-search://?' + encodeURIComponent('https://' + GO) },

    { id:'full_apple', label:'4. Full https URL → App Store',
      note:'x-web-search://?https://' + APPLE,
      href:'x-web-search://?https://' + APPLE },

    { id:'bare_apple', label:'5. Bare host+path → App Store',
      note:'x-web-search://?' + APPLE,
      href:'x-web-search://?' + APPLE }
  ];

  var results={};
  try{ results = JSON.parse(get(RKEY)||'{}'); }catch(e){ results={}; }

  function toast(m){ var e=$('toast'); e.textContent=m; e.classList.add('show');
    setTimeout(function(){ e.classList.remove('show'); },2600); }

  // ---- ask-on-return ----
  var asking = null;
  function ask(id){
    var t = null;
    TESTS.forEach(function(x){ if(x.id===id) t=x; });
    if(!t) return;
    asking = id;
    $('mtitle').textContent = 'What did you see?';
    $('msub').textContent = t.label.replace(/^\d+\.\s*/,'') + ' — pick what actually happened.';
    $('modal').classList.add('show');
  }
  Array.prototype.forEach.call(document.querySelectorAll('.sheet button'), function(b){
    b.addEventListener('click', function(){
      if(asking){
        results[asking] = b.getAttribute('data-v');
        set(RKEY, JSON.stringify(results));
        asking = null;
      }
      $('modal').classList.remove('show');
      render();
    });
  });

  var pending=null;
  try{ pending = JSON.parse(get(PKEY)||'null'); }catch(e){}
  if(pending && pending.id){ del(PKEY); setTimeout(function(){ ask(pending.id); }, 300); }

  var rows={}, host=$('tests');
  TESTS.forEach(function(t){
    var row=document.createElement('div'); row.className='test';
    var a=document.createElement('a'); a.href=t.href; a.rel='noopener';
    a.innerHTML = t.label + '<span class="n">'+t.note.replace(/</g,'&lt;')+'</span>' +
                  '<span class="res" id="res_'+t.id+'"></span>';
    var chip=document.createElement('div'); chip.className='chip wait'; chip.textContent='·';
    a.addEventListener('click', function(){
      set(PKEY, JSON.stringify({id:t.id}));
      // If Safari never takes over, no reload happens — ask anyway shortly.
      setTimeout(function(){
        if(document.visibilityState==='visible' && !asking){ del(PKEY); ask(t.id); }
      }, 2600);
    });
    row.appendChild(a); row.appendChild(chip); host.appendChild(row);
    rows[t.id]={a:a,chip:chip};
    if(!(t.id in results)) results[t.id]='not answered';
  });

  function render(){
    var done=0, nextSet=false;
    TESTS.forEach(function(t){
      var r=results[t.id]||'not answered', o=rows[t.id];
      o.a.classList.remove('next','done');
      var res=$('res_'+t.id);
      if(r==='not answered'){
        o.chip.className='chip wait'; o.chip.textContent='·'; res.textContent='';
        if(!nextSet){ o.a.classList.add('next'); nextSet=true; }
      } else {
        done++; o.a.classList.add('done');
        var win = (r==='APP STORE OPENED' || r==='MY PAGE LOADED IN SAFARI');
        o.chip.className='chip '+(win?'ok':'bad'); o.chip.textContent = win?'✓':'✗';
        res.textContent = r; res.style.color = win ? 'var(--ok)' : 'var(--muted)';
      }
    });
    $('count').textContent = done+' of '+TESTS.length+' answered'+(done===TESTS.length?' — hit Copy results':'');
  }
  render();

  function blob(){
    var l=['STRUT ROUND 5 — does Safari navigate or search?',
           'time: '+new Date().toISOString(),
           'ua:   '+ua,'--- results ---'];
    TESTS.forEach(function(t){ l.push(t.label.replace(/\s+/g,' ')+'  =>  '+(results[t.id]||'not answered')); });
    return l.join('\n');
  }

  $('copy').addEventListener('click', function(){
    var text=blob(), out=$('out'); out.value=text; out.classList.add('show');
    function fb(){ out.removeAttribute('readonly'); out.select(); out.setSelectionRange(0,99999);
      try{ document.execCommand('copy')?toast('Copied'):toast('Select the text below and copy'); }
      catch(e){ toast('Select the text below and copy'); }
      out.setAttribute('readonly',''); }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(function(){toast('Copied — paste it to Claude');},fb);
    else fb();
  });

  $('reset').addEventListener('click', function(){
    del(RKEY); del(PKEY); results={};
    TESTS.forEach(function(t){ results[t.id]='not answered'; });
    $('out').classList.remove('show'); render(); toast('Cleared');
  });
})();
</script>
</body>
</html>
